<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>金山文档 PDF 阅读壳</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e9edf2; }
    iframe {
      display: block; position: fixed; inset: 0;
      width: 100%; height: 100%; border: 0; background: #e9edf2;
    }
    #notice {
      position: fixed; inset: 0; display: none; place-items: center;
      padding: 28px; box-sizing: border-box; background: #fff;
      font: 15px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      color: #3d4653; text-align: center;
    }
    #notice .box { max-width: 420px; }
    #notice h1 { margin: 0 0 10px; font-size: 17px; font-weight: 600; color: #1f2733; }
    #notice p { margin: 0 0 18px; }
    #notice a, #notice button {
      display: inline-block; padding: 9px 20px; border: 1px solid #c9a063;
      border-radius: 8px; background: #fbf6ec; color: #7a5418;
      font-size: 15px; text-decoration: none; cursor: pointer;
    }
    #dbg {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
      display: none; padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: rgba(22, 27, 35, .94); color: #e8edf5;
      font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap; word-break: break-all; max-height: 46vh; overflow: auto;
      -webkit-user-select: text; user-select: text;
    }
    #dbg b { color: #e3c07a; font-weight: 600; }
  </style>
</head>
<body>
  <div id="notice"><div class="box">
    <h1>文档无法嵌入</h1>
    <p id="notice-text">这条链接可能已失效，或金山文档限制了嵌入。</p>
    <a id="fallback" href="#" rel="noopener">在新窗口直接打开</a>
  </div></div>
  <pre id="dbg"></pre>
  <script>
    (function () {
      var DEFAULT_DOC = 'https://www.kdocs.cn/l/cqwhDjLzdMuz?f=301';
      var params = new URLSearchParams(location.search);
      var debug = params.get('debug') === '1';
      var raw = params.get('doc') || DEFAULT_DOC;
      var notice = document.getElementById('notice');
      var noticeText = document.getElementById('notice-text');
      var fallback = document.getElementById('fallback');
      var dbg = document.getElementById('dbg');
      var logLines = [];

      function log(label, value) {
        logLines.push(label + ': ' + value);
        if (debug) dbg.textContent = logLines.join('\n');
      }

      function fixDoubleQuestion(url) {
        var q = url.indexOf('?');
        if (q < 0) return url;
        var head = url.slice(0, q + 1);
        var tail = url.slice(q + 1).replace(/\?/g, '&');
        return head + tail;
      }

      function fail(message) {
        notice.style.display = 'grid';
        noticeText.textContent = message;
      }

      var target;
      try {
        raw = fixDoubleQuestion(raw.trim());
        target = new URL(raw, location.href);
        var okHost = /^(?:www\.)?kdocs\.cn$/i.test(target.hostname);
        var okPath = /^\/(?:l|office)\//i.test(target.pathname);
        if (target.protocol !== 'https:' || !okHost || !okPath) {
          throw new Error('只允许 www.kdocs.cn 的 /l/ 或 /office/ 文档链接');
        }
      } catch (err) {
        fail('链接无效：' + err.message);
        return;
      }

      fallback.href = target.href;
      log('top', location.href);
      log('target', target.href);
      log('ua', navigator.userAgent);
      log('viewport', innerWidth + 'x' + innerHeight + ' dpr=' + (devicePixelRatio || 1));

      var frame = document.createElement('iframe');
      frame.id = 'kdq-shell-frame';
      frame.src = target.href;
      frame.allow = 'clipboard-read *; clipboard-write *; fullscreen *; encrypted-media *';
      frame.referrerPolicy = 'no-referrer-when-downgrade';
      frame.setAttribute('allowfullscreen', '');
      document.body.appendChild(frame);

      var started = Date.now();
      var loadCount = 0;
      frame.addEventListener('load', function () {
        loadCount += 1;
        log('frame load #' + loadCount, (Date.now() - started) + 'ms');
      });

      setTimeout(function () {
        log('frame state', 'waited 18s; loads=' + loadCount);
        if (loadCount >= 3) {
          fail('文档被跳转到 WPS 登录页，iframe 方式无法显示。请点下方按钮在新窗口打开。');
        }
      }, 18000);

      if (debug) {
        dbg.style.display = 'block';
        log('debug', 'on');
      }
    })();
  </script>
</body>
</html>
